name: Desktop App

# Builds the Wails desktop app (packages/desktop-wails) with its bundled sync
# server for macOS, Windows and Linux: on pull requests that touch it, every
# night, and for releases, where the files are attached to the tag's GitHub
# release. The macOS app is signed and notarized when the signing secrets
# exist (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID); otherwise it gets an ad-hoc signature.

defaults:
  run:
    shell: bash

env:
  CI: true

on:
  pull_request:
    paths:
      - 'packages/desktop-wails/**'
      - 'packages/desktop-client/**'
      - 'packages/loot-core/**'
      - 'packages/sync-server-go/**'
      - 'bin/package-wails.mjs'
      - '.github/workflows/desktop.yml'
  push:
    tags:
      - v**
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: Actual-Pocket-mac-arm64.dmg
          - name: Windows
            os: windows-latest
            artifact: Actual-Pocket-windows-x64.zip
          - name: Linux
            os: ubuntu-24.04
            artifact: Actual-Pocket-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/desktop-wails/go.mod
          cache-dependency-path: |
            packages/desktop-wails/go.sum
            packages/sync-server-go/go.sum

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Test the desktop host
        run: go -C packages/desktop-wails test ./...

      - name: Build
        env:
          # Release CI signs with a Developer ID below instead
          ACTUAL_SKIP_CODESIGN: ${{ env.HAS_MAC_SIGNING == 'true' && '1' || '' }}
        run: pnpm run build:desktop

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          app="packages/desktop-wails/dist/Actual Pocket.app"
          identity="Developer ID Application"
          # Nested code first, then the bundle, with the hardened runtime
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" "$app/Contents/MacOS/actual-server"
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" "$app"
          codesign --verify --deep --strict "$app"

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$app"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          cp -R "packages/desktop-wails/dist/Actual Pocket.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Actual Pocket" -srcfolder "$staging" -ov -format UDZO "${{ matrix.artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "packages/desktop-wails/dist"
          Compress-Archive -Path "$dist/actual-pocket.exe", "$dist/actual-server.exe", "$dist/resources" -DestinationPath "${{ matrix.artifact }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.artifact }}" -C packages/desktop-wails/dist actual-pocket actual-server resources

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
          if-no-files-found: error

  release:
    name: Attach to release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "Desktop app for $TAG."
          fi
          gh release upload "$TAG" --clobber artifacts/*
