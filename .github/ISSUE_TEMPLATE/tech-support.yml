name: Tech Support
description: Need help with something? Having troubles setting up? Or perhaps issues using the API?
title: '[Support]: '
labels: ['tech-support']
body:
  - type: markdown
    attributes:
      value: |
        This is Actual Pocket, Danilo Urrutia's personal fork of Actual Budget. Issues may or may not be fixed, and pull requests will most likely not be merged. Responses and support are not guaranteed. See the [contribution policy](https://github.com/compdani/actual-pocket/blob/master/CONTRIBUTING.md).
  - type: markdown
    attributes:
      value: |
        Support requests may remain unanswered. The upstream Actual Budget community is not responsible for this fork.
  - type: textarea
    id: problem
    attributes:
      label: Describe your problem
      description: Please describe, in as much detail as you can, what you need help with.
      placeholder: I'm trying to [...] but [...]
    validations:
      required: true
